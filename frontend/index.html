<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <script>
      // Set theme before first paint to prevent flash
      (function() {
        var saved = localStorage.getItem('ship-eazy-theme');
        // v2: clear old dark default, start fresh with light
        if (!localStorage.getItem('ship-eazy-theme-v2')) {
          localStorage.removeItem('ship-eazy-theme');
          localStorage.setItem('ship-eazy-theme-v2', '1');
          saved = null;
        }
        if (saved === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ship.Eazy — Blockchain-based shipment tracking. Tamper-evident, role-enforced, immutable." />
    <title>Ship.Eazy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
